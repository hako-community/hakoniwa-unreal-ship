; 2026-10-03: Windows では Xbox 型は従来どおり XInput、それ以外の HID ゲームパッドは GameInput の Controller として読む。
; bProcessGamepad を True にすると Xbox 型の入力が XInput と二重になる。割り当ては DefaultInput.ini の DeviceConfigurations。
[GameInputPlatformSettings_Windows GameInputPlatformSettings]
bProcessController=True
bProcessGamepad=False
bSpecialDevicesRequireExplicitDeviceConfiguration=True
